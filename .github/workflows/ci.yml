name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install ffmpeg for audio silence-detection tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run synthetic unit test suite
        run: python scripts/run_tests.py --unit-only -v

      - name: Set up Node 24 for JS syntax check
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check frontend JavaScript syntax
        run: |
          for f in static/kiosk/js/*.js static/js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
