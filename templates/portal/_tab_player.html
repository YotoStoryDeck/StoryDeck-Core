        <!-- ===================================================================== -->
        <!-- TAB 1: PLAYER                                                         -->
        <!-- ===================================================================== -->
        <section id="tabPlayer" class="tab-view active">
          <!-- Player Console -->
          <div class="player-card">
            <div class="player-cover">
              <img id="playerCoverImg" src="/static/img/placeholder.png" alt="Cover">
              <div id="playerPendingOverlay" class="player-pending-overlay" style="display: none;">
                <div class="player-pending-spinner" id="playerPendingSpinner"></div>
                <div class="player-pending-text" id="playerPendingText">Waiting for player confirmation...</div>
              </div>
              <div id="playerModeBadge"
                style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-subtle); z-index: 3;">
                ⚡ Streaming
              </div>
            </div>

            <div class="player-title" id="playerTitle">No Active Playback</div>
            <div class="player-subtitle" id="playerSubtitle">Select an audiobook from the Library tab</div>
            <div id="playerAttachedCardTag" style="display: none; margin-bottom: 8px;">
              <span id="playerAttachedCardText"
                style="display: inline-block; background: rgba(234, 88, 12, 0.15); color: #ea580c; border: 1px solid rgba(234, 88, 12, 0.4); font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 600;">
                💳 Attached Playlist
              </span>
            </div>
            <div id="playerTelemetryBadges"
              style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 12px;">
              <!-- Telemetry badges rendered via JS -->
            </div>

            <!-- Scrub bar -->
            <div class="scrub-container">
              <input type="range" id="playerScrubBar" class="scrub-slider" min="0" max="100" value="0"
                oninput="onScrubInput(this.value)" onchange="onScrubChange(this.value)">
              <div class="scrub-times">
                <span id="playerTimeElapsed">0:00</span>
                <span id="playerTimeRemaining">-0:00</span>
              </div>
            </div>

            <!-- Big Transport Buttons -->
            <div class="transport-controls">
              <button class="btn-circle" onclick="sendPlayerTransport('prev')" title="Previous Chapter">⏮️</button>
              <button class="btn-circle" onclick="sendPlayerTransport('back30')" title="Back 30 Seconds"
                style="font-size: 11px; font-weight: 700;">-30s</button>
              <button class="btn-circle btn-circle-lg" id="btnPlayPause" onclick="togglePlayPause()"
                title="Play / Pause">▶️</button>
              <button class="btn-circle" onclick="sendPlayerTransport('fwd30')" title="Forward 30 Seconds"
                style="font-size: 11px; font-weight: 700;">+30s</button>
              <button class="btn-circle" onclick="sendPlayerTransport('next')" title="Next Chapter">⏭️</button>
            </div>

            <!-- Volume Slider with Ceiling Clamp & Playback Speed -->
            <div class="volume-box">
              <span>🔊</span>
              <div class="volume-slider-wrap">
                <input type="range" id="playerVolumeSlider" min="0" max="100" value="50"
                  oninput="onVolumeInput(this.value)" onchange="onVolumeChange(this.value)">
                <div id="playerVolumeCapMarker" class="volume-cap-marker" style="display: none;"></div>
              </div>
              <span id="playerVolumeLabel"
                style="font-size: 12px; font-weight: 600; min-width: 36px; white-space: nowrap;">50%</span>
              <select id="playerSpeedSelect" class="form-control"
                style="width: 72px; font-size: 11px; padding: 3px 6px; height: 28px;"
                onchange="onPlayerSpeedChange(this.value)" title="Playback Speed">
                <option value="0.75">0.75x</option>
                <option value="1" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="1.75">1.75x</option>
                <option value="2">2.0x</option>
              </select>
            </div>

            <!-- Sleep Timer -->
            <div style="margin-top: 14px;">
              <span style="font-size: 11px; color: var(--text-secondary); display: block; margin-bottom: 8px;"
                id="sleepTimerStatusLabel">🌙 Bedtime Sleep Timer</span>
              <div class="sleep-timer-row">
                <button class="btn btn-secondary btn-sm" onclick="setSleepTimer(15)">15m</button>
                <button class="btn btn-secondary btn-sm" onclick="setSleepTimer(30)">30m</button>
                <button class="btn btn-secondary btn-sm" onclick="setSleepTimer(45)">45m</button>
                <button class="btn btn-secondary btn-sm" onclick="setSleepTimer(60)">60m</button>
                <button class="btn btn-secondary btn-sm" onclick="setSleepTimer(0)">Off</button>
              </div>
            </div>
          </div>

          <!-- Continue Listening Shelf -->
          <div id="continueListeningSection" style="margin-top: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <h4 style="font-size: 13px; margin: 0; color: var(--text-primary);">📖 Continue Listening</h4>
              <span style="font-size: 11px; color: var(--text-secondary);">Recent &amp; In-Progress</span>
            </div>
            <div id="continueListeningList" class="item-list">
              <!-- Populated via JS -->
            </div>
          </div>
        </section>
